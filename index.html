<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVIP 2026 - Secure Authentication</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="hero">
      <p class="badge">AVIP 2026 · Full Stack Development</p>
      <h1>Secure User Authentication</h1>
      <p>Register, login and access a protected profile endpoint.</p>
    </section>

    <section class="grid">
      <form id="registerForm" class="card">
        <h2>Create Account</h2>
        <label>Name</label>
        <input id="regName" required minlength="2" placeholder="Your name">
        <label>Email</label>
        <input id="regEmail" type="email" required placeholder="you@example.com">
        <label>Password</label>
        <input id="regPassword" type="password" required minlength="6" placeholder="Minimum 6 characters">
        <button type="submit">Register</button>
      </form>

      <form id="loginForm" class="card">
        <h2>Login</h2>
        <label>Email</label>
        <input id="loginEmail" type="email" required placeholder="you@example.com">
        <label>Password</label>
        <input id="loginPassword" type="password" required placeholder="Your password">
        <button type="submit">Login</button>
      </form>
    </section>

    <section class="card">
      <div class="row">
        <div>
          <h2>Protected Profile</h2>
          <p class="muted">This request requires a valid JWT.</p>
        </div>
        <button id="profileBtn" class="secondary">Get Profile</button>
      </div>
      <pre id="output">API response will appear here...</pre>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
